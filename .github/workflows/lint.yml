# Goal of the linter is to check the syntax, formatting, spacing, indentation etc.

name: Auto-linter

on:
  push:
    paths: "*.py"


jobs:
  code-linters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
       # ruff is a python auto linter
       # below step will install ruff
    
      - name: Install Linter
        run: pip install ruff
        
        # next step will run the linter
      - name: Check the files for linting
        run: ruff check .
